spring.application.name=budgeting

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.8
org.gradle.configuration-cache=true

management.endpoints.web.exposure.include=mappings,health,info

springdoc.swagger-ui.path=/swagger

spring.ai.model.audio.transcription=openai
spring.ai.open.audio.transcription.options.model=whisper-1
spring.ai.open.audio.transcription.options.language=pt
spring.ai.open.audio.transcription.options.temperature=0
spring.ai.open.audio.transcription.options.response-format=text
spring.ai.open.audio.transcription.options.prompt= Áudio em português brasileiro.\
  As frases geralmente contêm: \
  - um valor em reais(número + "reais");\
  - uma ação (gastei, paguei, comprei);\
  - um local ou estabelecimento (mercado,farmácia,restaurante,etc.);\
  - As frases podêm conter também saudações (bom dia, boa tarde, boa noite).

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model = gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice = shimmer
spring.ai.openai.audio.speech.options.speed = 1.2
spring.ai.openai.audio.speech.options.response-format = mp3



//logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.ai=DEBUG
